<circle cx="800" cy="294" r="31" fill="#FFFFFF" opacity=".9"/>
<text x="800" y="305" font-size="35" text-anchor="middle" font-weight="750" fill="#E69C0C">☷</text>
<text x="800" y="367" font-size="23" font-weight="750" text-anchor="middle" fill="#101A33">make-plan</text>
<text x="800" y="405" font-size="19" text-anchor="middle" fill="#33445B"><tspan x="800">Turn a task into</tspan><tspan x="800" dy="26">an actionable plan</tspan></text>
</g>
