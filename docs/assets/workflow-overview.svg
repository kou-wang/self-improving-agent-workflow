<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 810" role="img" aria-labelledby="title description">
<title id="title">Self-Improving Agent Workflow</title>
<desc id="description">Five independently usable skills: learn-requirement, investigate, make-plan, execute and review-skill. Review-skill proposes preference, skill and project-local skill improvements with developer approval. Benefits: adaptable expression, fewer repeated interactions and reusable workflows.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F6F5FF"/></linearGradient><linearGradient id="strip" x1="0" y1="0" x2="1"><stop stop-color="#ECEEFF"/><stop offset="1" stop-color="#F6EAFF"/></linearGradient></defs>
<rect width="1600" height="810" rx="36" fill="url(#bg)"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="800" y="83" font-size="54" font-weight="800" text-anchor="middle" fill="#0E1731">Self-Improving Agent Workflow</text>
<text x="800" y="124" font-size="22" text-anchor="middle" fill="#64708C">Make your coding agent adapt to you — with five independent skills and an approved feedback loop.</text>
<rect x="32" y="163" width="1536" height="323" rx="33" fill="#FFFFFF" stroke="#CFD8FF" stroke-width="2"/>
<rect x="66" y="181" width="438" height="42" rx="21" fill="url(#strip)"/>
<text x="88" y="209" font-size="23" font-weight="750" fill="#202D63">Five Core Skills</text>
<text x="309" y="208" font-size="20" fill="#56618A">(use independently)</text>
<rect x="1070" y="181" width="458" height="42" rx="21" fill="#F2EEFF"/>
<text x="1299" y="208" font-size="18" text-anchor="middle" fill="#5E43AC">No rigid pipeline — call any skill you need</text>
<g>
