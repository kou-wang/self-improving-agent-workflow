<text x="1103" y="367" font-size="23" font-weight="750" text-anchor="middle" fill="#101A33">execute</text>
<text x="1103" y="405" font-size="19" text-anchor="middle" fill="#33445B"><tspan x="1103">Carry out approved</tspan><tspan x="1103" dy="26">work safely</tspan></text>
</g>
