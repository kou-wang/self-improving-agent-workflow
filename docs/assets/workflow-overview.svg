<text x="497" y="367" font-size="23" font-weight="750" text-anchor="middle" fill="#101A33">investigate</text>
<text x="497" y="405" font-size="19" text-anchor="middle" fill="#33445B"><tspan x="497">Explain bugs and</tspan><tspan x="497" dy="26">unexpected behavior</tspan></text>
</g>
<g>
