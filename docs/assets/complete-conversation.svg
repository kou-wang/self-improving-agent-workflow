<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1240" role="img" aria-labelledby="title description">
<title id="title">A Complete Workflow in a Real Conversation</title>
<desc id="description">A realistic brief chat. A user supplies a screenshot and invokes investigate. The agent identifies a root cause: backend skips updates for empty values. User invokes make-plan, then asks to disable Save after sending a request to prevent duplicates. Execute implements the approved plan. Review proposes two reusable improvements; user selects only the first and invokes execute to save the preference.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#F7F6FF"/></linearGradient><linearGradient id="side" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F0F5FF"/><stop offset="1" stop-color="#EFE5FF"/></linearGradient></defs>
<rect width="1600" height="1240" rx="32" fill="url(#bg)"/>
<g font-family="Arial,Helvetica,sans-serif">
<text x="800" y="59" font-size="47" font-weight="800" text-anchor="middle" fill="#101932">A Complete Workflow in a Real Conversation</text>
<text x="800" y="97" font-size="21" text-anchor="middle" fill="#656F92">Minimal input. Natural discussion. Continuous improvement.</text>
<rect x="44" y="125" width="975" height="1096" rx="28" fill="#FFFFFF" stroke="#C9C4FD" stroke-width="2"/>
<path d="M72 125 H991 Q1019 125 1019 153 V172 H44 V153 Q44 125 72 125" fill="#F4F1FF"/>
<text x="80" y="157" font-size="22" font-weight="750" fill="#162047">✦  Self-Improving Agent</text>
<rect x="600" y="185" width="360" height="48" rx="18" fill="#E7F1FF" stroke="#D2E5FC" stroke-width="1.4"/>
<text x="618" y="212" fill="#222D4B" font-size="19" font-weight="500"><tspan x="618" dy="0">bug-screenshot.png   /investigate</tspan></text>
<circle cx="986" cy="208" r="21" fill="#DBEAFF"/><text x="986" y="216" font-size="24" font-weight="800" text-anchor="middle" fill="#2672D7">◯</text>
<rect x="112" y="241" width="826" height="78" rx="18" fill="#F0EDFF" stroke="#E0D8FF" stroke-width="1.4"/>
<text x="130" y="268" fill="#222D4B" font-size="19" font-weight="500"><tspan x="130" dy="0">ROOT CAUSE — Backend code skips the database update for empty values.</tspan><tspan x="130" dy="24">The save API returns success even though the update SQL is not run.</tspan></text>
<circle cx="80" cy="264" r="21" fill="#E9E2FF"/><text x="80" y="272" font-size="24" font-weight="800" text-anchor="middle" fill="#7350DA">✦</text>
<rect x="600" y="334" width="360" height="48" rx="18" fill="#E7F1FF" stroke="#D2E5FC" stroke-width="1.4"/>
<text x="618" y="361" fill="#222D4B" font-size="19" font-weight="500"><tspan x="618" dy="0">/make-plan</tspan></text>
<circle cx="986" cy="357" r="21" fill="#DBEAFF"/><text x="986" y="365" font-size="24" font-weight="800" text-anchor="middle" fill="#2672D7">◯</text>
<rect x="112" y="389" width="760" height="103" rx="18" fill="#F0EDFF" stroke="#E0D8FF" stroke-width="1.4"/>
<text x="130" y="416" fill="#222D4B" font-size="19" font-weight="500"><tspan x="130" dy="0">PROPOSED PLAN</tspan><tspan x="130" dy="24">1   Fix backend handling of empty values.</tspan><tspan x="130" dy="24">2   Add failure logging and a regression test.</tspan></text>
<circle cx="80" cy="412" r="21" fill="#E9E2FF"/><text x="80" y="420" font-size="24" font-weight="800" text-anchor="middle" fill="#7350DA">✦</text>
<rect x="600" y="504" width="360" height="78" rx="18" fill="#E7F1FF" stroke="#D2E5FC" stroke-width="1.4"/>
<text x="618" y="531" fill="#222D4B" font-size="19" font-weight="500"><tspan x="618" dy="0">After sending the request, disable the Save button</tspan><tspan x="618" dy="24">to prevent duplicate submissions.</tspan></text>
<circle cx="986" cy="527" r="21" fill="#DBEAFF"/><text x="986" y="535" font-size="24" font-weight="800" text-anchor="middle" fill="#2672D7">◯</text>
<rect x="112" y="594" width="760" height="123" rx="18" fill="#F0EDFF" stroke="#E0D8FF" stroke-width="1.4"/>
<text x="130" y="619" fill="#222D4B" font-size="17" font-weight="500"><tspan x="130" dy="0">UPDATED PLAN</tspan><tspan x="130" dy="24">1   Fix backend handling of empty values.</tspan><tspan x="130" dy="24">2   Disable Save while the request is in flight.</tspan><tspan x="130" dy="24">3   Add logging and a regression test.</tspan></text>
<circle cx="80" cy="617" r="21" fill="#E9E2FF"/><text x="80" y="625" font-size="24" font-weight="800" text-anchor="middle" fill="#7350DA">✦</text>
<rect x="600" y="730" width="360" height="48" rx="18" fill="#E7F1FF" stroke="#D2E5FC" stroke-width="1.4"/>
<text x="618" y="757" fill="#222D4B" font-size="19" font-weight="500"><tspan x="618" dy="0">/execute</tspan></text>
<circle cx="986" cy="753" r="21" fill="#DBEAFF"/><text x="986" y="761" font-size="24" font-weight="800" text-anchor="middle" fill="#2672D7">◯</text>
<rect x="112" y="790" width="826" height="77" rx="18" fill="#E6F8EC" stroke="#B8E7C8" stroke-width="1.4"/>
<text x="130" y="817" fill="#222D4B" font-size="19" font-weight="500"><tspan x="130" dy="0">IMPLEMENTED — Fixed persistence, disabled duplicate submissions,</tspan><tspan x="130" dy="24">added failure logging, and verified the regression test.</tspan></text>
<circle cx="80" cy="813" r="21" fill="#E9E2FF"/><text x="80" y="821" font-size="24" font-weight="800" text-anchor="middle" fill="#7350DA">✦</text>
<rect x="600" y="888" width="360" height="48" rx="18" fill="#E7F1FF" stroke="#D2E5FC" stroke-width="1.4"/>
<text x="618" y="915" fill="#222D4B" font-size="19" font-weight="500"><tspan x="618" dy="0">/review-skill</tspan></text>
<circle cx="986" cy="911" r="21" fill="#DBEAFF"/><text x="986" y="919" font-size="24" font-weight="800" text-anchor="middle" fill="#2672D7">◯</text>
<rect x="112" y="946" width="826" height="104" rx="18" fill="#F0EDFF" stroke="#E0D8FF" stroke-width="1.4"/>
<text x="130" y="973" fill="#222D4B" font-size="19" font-weight="500"><tspan x="130" dy="0">TWO REUSABLE SUGGESTIONS (no files changed)</tspan><tspan x="130" dy="24">1   Save concise, outcome-first explanations while keeping technical terms.</tspan><tspan x="130" dy="24">2   Update make-plan to consider duplicate-submission UI behavior.</tspan></text>
<circle cx="80" cy="969" r="21" fill="#E9E2FF"/><text x="80" y="977" font-size="24" font-weight="800" text-anchor="middle" fill="#7350DA">✦</text>
<rect x="600" y="1064" width="360" height="46" rx="18" fill="#E7F1FF" stroke="#D2E5FC" stroke-width="1.4"/>
<text x="618" y="1091" fill="#222D4B" font-size="19" font-weight="500"><tspan x="618" dy="0">Choose 1. /execute</tspan></text>
<circle cx="986" cy="1087" r="21" fill="#DBEAFF"/><text x="986" y="1095" font-size="24" font-weight="800" text-anchor="middle" fill="#2672D7">◯</text>
<rect x="112" y="1123" width="826" height="50" rx="18" fill="#E6F8EC" stroke="#B8E7C8" stroke-width="1.4"/>
<text x="130" y="1150" fill="#222D4B" font-size="19" font-weight="500"><tspan x="130" dy="0">Updated user-preferences.md with suggestion 1 only.</tspan></text>
<circle cx="80" cy="1146" r="21" fill="#E9E2FF"/><text x="80" y="1154" font-size="24" font-weight="800" text-anchor="middle" fill="#7350DA">✦</text>
<g>
<rect x="1060" y="160" width="500" height="205" rx="30" fill="url(#side)" stroke="#E3DFFD"/>
<text x="1095" y="214" font-size="32" font-weight="790" fill="#18234C">⚡ Minimal Input</text>
<text x="1095" y="258" font-size="22" fill="#364163">Paste a screenshot or log, then</text>
<text x="1095" y="289" font-size="22" fill="#364163">invoke the relevant Skill directly.</text>
<rect x="1060" y="387" width="500" height="235" rx="30" fill="url(#side)" stroke="#E3DFFD"/>
<text x="1095" y="440" font-size="32" font-weight="790" fill="#18234C">◌ Natural Conversation</text>
<text x="1095" y="483" font-size="22" fill="#364163">Refine the plan in plain language.</text>
<text x="1095" y="514" font-size="22" fill="#364163">Keep technical terms, and avoid</text>
<text x="1095" y="545" font-size="22" fill="#364163">repeating prior context.</text>
<rect x="1060" y="644" width="500" height="267" rx="30" fill="url(#side)" stroke="#E3DFFD"/>
<text x="1095" y="700" font-size="30" font-weight="790" fill="#18234C">◇ Continuous Improvement</text>
<text x="1095" y="744" font-size="21" fill="#364163">Review proposes preference or</text>
<text x="1095" y="773" font-size="21" fill="#364163">Skill changes. Choose what to</text>
<text x="1095" y="802" font-size="21" fill="#364163">apply, then use /execute.</text>
<rect x="1060" y="937" width="500" height="235" rx="30" fill="#EEE7FF" stroke="#DDD0FC"/>
<text x="1095" y="996" font-size="33" font-weight="790" fill="#332077">The Result</text>
<text x="1095" y="1043" font-size="23" fill="#364163">Fix the real root cause,</text>
<text x="1095" y="1075" font-size="23" fill="#364163">reduce repeat prompts, and</text>
<text x="1095" y="1107" font-size="23" fill="#364163">adapt to developer feedback.</text>
</g>
</g></svg>