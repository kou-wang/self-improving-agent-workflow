[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "self-improving-agent-workflow"
version = "0.2.0"
description = "Human-approved, self-improving Skills for Cursor and Claude Code"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Self-Improving Agent Workflow contributors"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]

[project.scripts]
agent-workflow = "agent_workflow.cli:main"

[tool.setuptools]
packages = ["agent_workflow", "scripts"]
